<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Noto Sans KR", system-ui, -apple-system, sans-serif;
    --bg: #fbf7f1;
    --card: #ffffff;
    --ink: #1f2a2e;
    --muted: #6b7a80;
    --line: #e6ded2;
    --tangerine: #f08a24;
    --tangerine-soft: #fff1e2;
    --sea: #127c86;
    --sea-soft: #e3f3f4;
    --now: #fff6d6;
    --on-accent: #ffffff;
    --land: #efe6d6;
    --land-edge: #d9ccb6;
    --water: #dcecee;
    --pin-ring: #ffffff;
    --wave: #c9e0e3;
    --land-high: #e3e2c4;
    --contour: #d6cdb2;
    --contour-strong: #b9ab8c;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181a; --card: #1b2326; --ink: #e9eef0; --muted: #93a3a9;
      --line: #2c373b; --tangerine: #ff9a3c; --tangerine-soft: #3a2a1a;
      --sea: #4cc3cc; --sea-soft: #173235; --now: #3a3418;
      --land: #2b3431; --land-edge: #47554f; --water: #142126; --pin-ring: #f4f7f8; --wave: #1b2d33; --land-high: #33403a; --contour: #3c4a44; --contour-strong: #5d6e66; --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181a; --card: #1b2326; --ink: #e9eef0; --muted: #93a3a9;
    --line: #2c373b; --tangerine: #ff9a3c; --tangerine-soft: #3a2a1a;
    --sea: #4cc3cc; --sea-soft: #173235; --now: #3a3418;
    --land: #2b3431; --land-edge: #47554f; --water: #142126; --pin-ring: #f4f7f8; --wave: #1b2d33; --land-high: #33403a; --contour: #3c4a44; --contour-strong: #5d6e66; --shadow: none; color-scheme: dark;
  }
  :root:lang(ja) { --font: "Noto Sans JP", "Noto Sans KR", system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

  header.hero { padding: 40px 0 20px; }
  .hero .eyebrow { color: var(--tangerine); font-weight: 700; font-size: 14px; letter-spacing: .04em; }
  .hero h1 { text-wrap: balance; margin: 4px 0 8px; font-size: 32px; font-weight: 900; letter-spacing: -.02em; }
  .hero p { margin: 0; color: var(--muted); font-size: 15px; }
  .summary { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .chip-stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; flex: 1 1 140px; }
  .chip-stat b { display: block; font-size: 18px; }
  .chip-stat span { font-size: 12px; color: var(--muted); }

  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .lang { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang button { font: 700 12px var(--font); border: 0; background: none; color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .lang button:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .sync { margin: 12px 0 0; font-size: 12px; color: var(--sea); }
  .sync::before { content: "● "; }
  .sync.off { color: var(--muted); }
  nav.tabs {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    display: flex; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  nav.tabs a:focus-visible, .tag.map:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  nav.tabs a {
    flex: 1; text-align: center; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 12px; font-weight: 700; font-size: 14px;
  }
  nav.tabs a small { font-weight: 500; color: var(--muted); margin-left: 4px; }

  section.day { padding-top: 24px; scroll-margin-top: 64px; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .day-head h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .day-head h2 em { font-style: normal; color: var(--tangerine); margin-right: 6px; }
  .day-head .sub { color: var(--muted); font-size: 13px; white-space: nowrap; }

  ol.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.timeline::before {
    content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px;
    width: 2px; background: var(--line);
  }
  .item { position: relative; padding-left: 28px; margin-bottom: 10px; }
  .item::before {
    content: ""; position: absolute; left: 1px; top: 18px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--card); border: 3px solid var(--tangerine);
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; box-shadow: var(--shadow);
  }
  .time { font-size: 13px; font-weight: 700; color: var(--sea); font-variant-numeric: tabular-nums; }
  .title { font-size: 16px; font-weight: 700; margin: 2px 0 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; border-radius: 6px; padding: 3px 8px; }
  .tag.price { background: var(--tangerine-soft); color: var(--tangerine); font-weight: 700; }
  .tag.hours { background: var(--sea-soft); color: var(--sea); }
  .tag.map { background: transparent; border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .tag.map:hover { border-color: var(--sea); color: var(--sea); }
  .note { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .note::before { content: "💡 "; }

  /* 이동 구간 */
  .item.move { margin: -2px 0 8px; }
  .item.move::before { width: 8px; height: 8px; left: 4px; top: 9px; border: none; background: var(--line); }
  .item.move .card { background: transparent; border: none; box-shadow: none; padding: 2px 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .item.move .time { color: var(--muted); font-weight: 500; font-size: 12px; }
  .item.move .title { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0; }
  .item.move .note { margin: 0; flex-basis: 100%; font-size: 12px; }

  /* 지금 진행 중 */
  .item.now .card { background: var(--now); border-color: var(--tangerine); }
  .item.now::before { background: var(--tangerine); }
  .now-badge { display: inline-block; margin-left: 6px; font-size: 11px; background: var(--tangerine); color: var(--on-accent); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }

  footer.total {
    margin-top: 32px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; box-shadow: var(--shadow);
  }
  footer.total h3 { margin: 0 0 10px; font-size: 15px; }
  footer.total .row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  footer.total .row.sum { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; font-weight: 900; font-size: 18px; color: var(--tangerine); }

  /* 경로 지도 */
  .route-map { margin: 0 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .route-map figcaption { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 12px 14px; flex-wrap: wrap; }
  .route-map .cap-text { display: flex; flex-direction: column; min-width: 0; }
  .route-map .cap-text > span { font-weight: 700; font-size: 14px; }
  .route-map .cap-text small { color: var(--muted); font-size: 12px; }
  .map-tools { display: flex; gap: 6px; }
  .tool { font: 700 13px var(--font); border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .tool:disabled { opacity: .5; cursor: default; }
  .tool.primary { background: var(--c); border-color: var(--c); color: var(--on-accent); }
  .tool:focus-visible, .stop:focus-visible, .pin:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
  .map-wrap { position: relative; }
  .tour-card { position: absolute; z-index: 3; top: 10px; left: 10px; right: 52px; max-width: 360px; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); animation: card-in .25s ease-out; }
  .tour-card .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--on-accent); font-weight: 900; font-size: 14px; }
  .tour-card.moving .n { background: var(--bg); color: var(--c); border: 2px solid var(--c); }
  .tour-card .t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .tour-card .t b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tour-card .t small { font-size: 12px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tour-card .cnt { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  @keyframes card-in { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .tour-card { animation: none; } }
  .route-map .map { position: relative; height: 440px; background: var(--water); border-block: 1px solid var(--line); }
  @media (max-width: 500px) { .route-map .map { height: 360px; } }
  .route-map .maplibregl-map { font-family: var(--font); }
  .route-map .map-note { margin: 0; padding: 0 14px 12px; font-size: 12px; color: var(--muted); }

  .pin { width: 34px; height: 42px; padding: 0; border: 0; background: none; cursor: pointer; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .pin span { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 auto; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c); border: 3px solid var(--pin-ring); box-sizing: border-box; transition: transform .15s; }
  .pin i { transform: rotate(45deg); font: normal 900 14px var(--font); color: var(--on-accent); }
  .pin:hover span { transform: rotate(-45deg) scale(1.12); }
  .pin.on span { transform: rotate(-45deg) scale(1.3); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent); }
  .pin.on { z-index: 5; }
  @media (prefers-reduced-motion: reduce) { .pin span { transition: none; } }

  .route-map .maplibregl-popup-content { background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .route-map .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--card); }
  .route-map .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--card); }
  .pop { display: flex; flex-direction: column; gap: 2px; }
  .pop small { color: var(--muted); font-size: 11px; }
  .pop b { font-size: 15px; }
  .pop a { margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--c); text-decoration: none; }

  .route-map .strip { list-style: none; margin: 0; padding: 12px 14px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; font-size: 13px; }
  .route-map .strip .stop { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 3px; font: inherit; color: var(--ink); cursor: pointer; }
  .route-map .strip .stop:hover { border-color: var(--c); }
  .route-map .strip .stop b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: var(--on-accent); font-variant-numeric: tabular-nums; }
  .route-map .strip .leg { color: var(--muted); font-size: 12px; padding: 0 2px; }
  .route-map .strip .leg::before { content: "→ "; }
  .route-map .strip .leg.shuttle { font-style: italic; }
  .tag.nav { background: transparent; border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .tag.nav:hover { border-color: var(--tangerine); color: var(--tangerine); }
  .tag.nav:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
</style>
</head>

    map.addLayer({ ...lineBase, id: "progress-glow", source: "progress", paint: { "line-color": color, "line-width": width(10, 16), "line-opacity": 0.25, "line-blur": 3 } });
    map.addLayer({ ...lineBase, id: "progress", source: "progress", paint: { "line-color": color, "line-width": width(4.5, 8) } });
    map.addLayer({ id: "head", type: "circle", source: "head",
      paint: { "circle-radius": 7, "circle-color": dark ? "#f4f7f8" : "#ffffff", "circle-stroke-color": color, "circle-stroke-width": 4 } });
  });
  map.on("error", () => {
    if (!styleOk && !fellBack && dark) { fellBack = true; map.setStyle(MAP_STYLE.light); }
  });

  // 번호 핀과 말풍선
  const markers = day.route.map((k, i) => {
    const p = PLACES[k], when = stopTime(day, k), nm = pname(k);
    const el = document.createElement("button");
    el.type = "button"; el.className = "pin"; el.style.setProperty("--c", color);
    el.setAttribute("aria-label", `${i + 1}. ${nm}`);
    el.innerHTML = `<span><i>${i + 1}</i></span>`;
    const popup = new gl.Popup({ offset: 30, closeButton: false, maxWidth: "240px" }).setHTML(
      `<div class="pop"><small>${t("nth", i + 1)}${when ? " · " + esc(when) : ""}</small><b>${esc(nm)}</b><a href="${kakaoTo(k)}" target="_blank" rel="noopener">${t("kakao")}</a></div>`);
    return new gl.Marker({ element: el, anchor: "bottom" }).setLngLat(ll[i]).setPopup(popup).addTo(map);
  });
  const closeAll = () => markers.forEach(m => { const pp = m.getPopup(); if (pp && pp.isOpen()) pp.remove(); });
  const overview = (ms = 900) => map.fitBounds(bounds, { padding: pad(), duration: reduce ? 0 : ms });

  // 도로 경로 받아서 그리기 (실패하면 직선 점선 유지)
  let km = 0, failed = false;
  const routes = Promise.all(runs.map(r => {
    const coords = r.map(i => ll[i].join(",")).join(";");
    return fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`)
      .then(res => (res.ok ? res.json() : Promise.reject(res.status)))
      .then(j => { const rt = j.routes && j.routes[0]; if (!rt) throw 0; km += rt.distance / 1000; return rt.geometry.coordinates; })
      .catch(() => { failed = true; return null; });
  }));
  const loaded = new Promise(res => map.once("load", res));
  const visible = new Promise(res => {
    if (!("IntersectionObserver" in window)) return res();
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); res(); } }, { threshold: 0.35 });
    io.observe(map.getContainer());
  });

  // 구간별 좌표: 운전 경로를 들르는 장소 기준으로 잘라 구간마다 나눔
  let legCoords = null;
  const splitRun = (r, G) => {
    const out = []; let start = 0;
    for (let k = 1; k < r.length; k++) {
      let end = G.length - 1;
      if (k < r.length - 1) {
        const p = ll[r[k]]; let best = Infinity;
        for (let j = start; j < G.length; j++) { const d = segKm(G[j], p); if (d < best) { best = d; end = j; } }
      }
      out.push(G.slice(start, end + 1)); start = end;
    }
    return out;
  };

  Promise.all([routes, loaded]).then(([lines]) => {
    legCoords = day.legs.map((lg, i) => [ll[i], ll[i + 1]]);
    runs.forEach((r, ri) => { if (lines[ri]) splitRun(r, lines[ri]).forEach((c, k) => { if (c.length > 1) legCoords[r[k]] = c; }); });
    tourBtn.disabled = false;
  });

  Promise.all([routes, loaded, visible]).then(([lines]) => {
    if (km) document.getElementById(`km-${day.id}`).textContent = t("km", Math.round(km));
    if (failed) say(t("routeFail"));
    st.pending.features = runs.map((r, ri) => (lines[ri] ? null : line(r.map(i => ll[i])))).filter(Boolean);
    push("pending");
    const parts = lines.filter(Boolean);
    if (!parts.length) return;
    const total = parts.reduce((s, c) => s + c.length, 0);
    const draw = n => {
      let left = n; const feats = [];
      for (const c of parts) { if (left < 2) break; const take = Math.min(c.length, left); feats.push(line(c.slice(0, take))); left -= take; }
      st.drive.features = feats; push("drive");
    };
    if (reduce) { draw(total); return; }
    const t0 = performance.now(), dur = 1800;
    const step = now => {
      const f = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - f, 3);
      draw(Math.max(2, Math.ceil(total * e)));
      if (f < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });

  // 경로 따라가기: 지도는 그대로 두고, 점이 경로 선을 따라 순서대로 이동
  let touring = 0;
  const pause = ms => new Promise(r => setTimeout(r, ms));
  const dim = on => ["drive", "shuttle", "pending"].forEach(id => {
    try { map.setPaintProperty(id, "line-opacity", on ? 0.3 : id === "pending" ? 0.45 : 1); } catch (e) {}
  });
  const pinOn = i => markers.forEach((m, k) => m.getElement().classList.toggle("on", k === i));
  // 지도 위 안내 카드: 도착한 장소 / 이동 중인 구간
  const card = document.getElementById(`card-${day.id}`);
  const itemOf = k => day.items.find(x => x[7] === k);
  const showStop = i => {
    const k = day.route[i], it = itemOf(k), name = pname(k);
    const flat = t => t.replace(/\s/g, "");
    const what = it && flat(it[1]) !== flat(PLACES[k].name) ? tr(it[1]) : "";
    card.innerHTML = `<span class="n">${i + 1}</span><div class="t"><b>${esc(name)}</b><small>${[it ? it[0] : "", what].filter(Boolean).map(esc).join(" · ")}</small></div><span class="cnt">${i + 1}/${ll.length}</span>`;
    card.classList.remove("moving"); card.hidden = false;
  };
  const showMove = i => {
    const lg = day.legs[i], to = pname(day.route[i + 1]);
    card.innerHTML = `<span class="n">→</span><div class="t"><b>${esc(to)}</b><small>${t("moving", lg.shuttle, lg.min)}</small></div><span class="cnt">${i + 1}→${i + 2}</span>`;
    card.classList.add("moving"); card.hidden = false;
  };
  const reset = () => {
    st.progress = empty(); st.head = empty(); push("progress"); push("head");
    dim(false); pinOn(-1); card.hidden = true;
    tourBtn.textContent = t("tour"); tourBtn.setAttribute("aria-pressed", "false");
  };
  const along = (c, cum, d) => {
    let j = 1; while (j < c.length - 1 && cum[j] < d) j++;
    const a = c[j - 1], b = c[j], seg = cum[j] - cum[j - 1] || 1, f = Math.max(0, Math.min(1, (d - cum[j - 1]) / seg));
    return { idx: j, pt: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f] };
  };

  tourBtn.addEventListener("click", async () => {
    if (touring) { touring = 0; reset(); return; }
    if (!legCoords) return;
    const id = touring = Date.now();
    closeAll(); overview(700);
    tourBtn.textContent = t("stop"); tourBtn.setAttribute("aria-pressed", "true");
    dim(true); pinOn(0); showStop(0);
    st.head.features = [point(ll[0])]; push("head");
    await pause(reduce ? 0 : 1300);

    const legs = legCoords.map(c => {
      const cum = [0]; for (let j = 1; j < c.length; j++) cum.push(cum[j - 1] + segKm(c[j - 1], c[j]));
      return { c, cum, len: cum[cum.length - 1] };
    });
    const totalKm = legs.reduce((s, l) => s + l.len, 0) || 1;
    const TOTAL_MS = Math.min(14000, Math.max(7000, totalKm * 70));
    const done = [];

    for (let i = 0; i < legs.length && touring === id; i++) {
      const L = legs[i], dur = reduce ? 0 : Math.max(700, (L.len / totalKm) * TOTAL_MS);
      showMove(i);
      await new Promise(resolve => {
        const t0 = performance.now();
        const step = now => {
          if (touring !== id) return resolve();
          const f = dur ? Math.min(1, (now - t0) / dur) : 1;
          const e = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
          const { idx, pt } = along(L.c, L.cum, L.len * e);
          st.progress.features = [...done, line([...L.c.slice(0, idx), pt])];
          st.head.features = [point(pt)];
          push("progress"); push("head");
          if (f < 1) requestAnimationFrame(step); else resolve();
        };
        requestAnimationFrame(step);
      });
      if (touring !== id) break;
      done.push(line(L.c));
      pinOn(i + 1); showStop(i + 1);
      await pause(reduce ? 0 : 1300);
    }
    if (touring === id) { await pause(800); if (touring === id) { touring = 0; reset(); } }
  });

  document.querySelectorAll(`.stop[data-day="${day.id}"]`).forEach(b =>
    b.addEventListener("click", () => {
      if (touring) { touring = 0; reset(); }
      const i = Number(b.dataset.i);
      closeAll();
      map.flyTo({ center: ll[i], zoom: 14, duration: reduce ? 0 : 1600, essential: true });
      map.once("moveend", () => markers[i].getPopup().addTo(map));
    }));

  // 화면 테마가 바뀌면 지도도 바꿈
  darkMQ.addEventListener?.("change", () => location.reload());
}

const won = n => "₩" + n.toLocaleString("ko-KR");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const toMin = t => { const [h, m] = t.trim().split(":").map(Number); return h * 60 + m; };

// ───── 구글 시트 연동 ─────
// 시트에서 [파일 → 공유 → 웹에 게시]로 '일정' 탭을 CSV로 게시한 주소. 비워 두면 아래 저장된 일정을 씀.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzF3nNrml_1xx0r6UZ2P-xVZRPcf4BcAhsj8eadu-Y7bmYzEor1EzVNU1jvdbdKX9uOJCjyY-5bZU7/pub?gid=1449361810&single=true&output=csv";
const TRIP_YEAR = 2026;
const DAY_COLORS = ["--tangerine", "--sea"];
// 시트의 '위치' 링크 → 지도 좌표가 있는 장소
const LINK_PLACE = {
  "5iTRY8MW": "rent", "xMjKAdxA": "suragan", "GgWkousC": "dotori", "G0pEKmpK": "ghibli",
  "Fy2FnalF": "hanaro", "xbAXa2u0": "phoenix", "xoH8AY7q": "seopji", "G7V4dL7G": "seogwipean",
  "x4GcDO8i": "gyul", "IgJG8AuB": "park981", "F6lTm4jL": "midam"
};
const flat = t => String(t || "").replace(/\s/g, "");
function placeFor(title, link) {
  const code = (link.match(/naver\.me\/([\w-]+)/) || [])[1];
  if (code && LINK_PLACE[code]) return LINK_PLACE[code];
  if (/제주공항|공항\s*수속/.test(title)) return "airport";
  if (/^체크(인|아웃)$/.test(flat(title)) || (/휘닉스/.test(title) && /체크인/.test(title))) return "phoenix";
  const f = flat(title);
  return Object.keys(PLACES).find(k => f.includes(flat(PLACES[k].name))) || null;
}
const spanMin = t => { const [a, b] = String(t).split("-"); return b ? Math.max(0, toMin(b) - toMin(a)) : 0; };
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function parseSheet(rows) {
  const days = []; let day = null;
  rows.slice(1).forEach(r => {
    const [time = "", title0 = "", price = "", hours = "", link = "", note = ""] = r.map(c => String(c || "").trim());
    const title = title0.replace(/（/g, "(").replace(/）/g, ")");
    const m = time.match(/^(\d{1,2})\/(\d{1,2})\s*\((.)\)$/);
    if (m && !title) {
      const n = days.length + 1;
      day = { id: `day${n}`, label: `DAY ${n}`, date: time, iso: `${TRIP_YEAR}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`,
              color: DAY_COLORS[(n - 1) % DAY_COLORS.length], items: [], unknown: [] };
      days.push(day); return;
    }
    if (!day || !title) return;
    const move = /이동$/.test(title);
    const cost = Number(price.replace(/[^\d]/g, "")) || null;
    const place = move ? null : placeFor(title, link);
    if (!move && link && !place) day.unknown.push(title);
    day.items.push([time, title, cost, hours || null, link || null, note || null, move, place]);
  });
  // 방문 장소 순서와 구간별 이동 시간
  days.forEach(d => {
    d.route = []; d.legs = []; let min = 0, shuttle = false;
    d.items.forEach(it => {
      if (it[7]) {
        if (d.route[d.route.length - 1] === it[7]) { min = 0; shuttle = false; return; }
        // 사이에 '이동' 줄이 없으면 도착한 일정의 시간 안에 이동이 포함된 것으로 봄
        if (d.route.length) d.legs.push({ min: min || spanMin(it[0]), shuttle });
        d.route.push(it[7]); min = 0; shuttle = false;
      } else if (it[6] && d.route.length) {
        min += spanMin(it[0]);
        if (/셔틀/.test(it[1] + (it[5] || ""))) shuttle = true;
      }
    });
  });
  return days.filter(d => d.items.length);
}
async function loadSheet() {
  if (!SHEET_CSV_URL) return null;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
  try {
    const sep = SHEET_CSV_URL.includes("?") ? "&" : "?";
    const res = await fetch(`${SHEET_CSV_URL}${sep}t=${Date.now()}`, { signal: ctl.signal, cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const days = parseSheet(parseCSV(await res.text()));
    return days.length ? days : null;
  } catch (e) { return null; } finally { clearTimeout(timer); }
}

function render() {
const daysEl = document.getElementById("days");
const tabsEl = document.getElementById("tabs");
daysEl.innerHTML = ""; tabsEl.innerHTML = "";
let grand = 0;
const subtotals = [];

DAYS.forEach(day => {
  const sub = day.items.reduce((s, it) => s + (it[2] || 0), 0);
  grand += sub; subtotals.push([day, sub]);

  tabsEl.insertAdjacentHTML("beforeend",
    `<a href="#${day.id}">${day.label}<small>${dateL(day.date)}</small></a>`);

  const lis = day.items.map(([time, title, price, hours, map, note, move, place], i) => {
    const tags = [
      price ? `<span class="tag price">${won(price)}</span>` : "",
      hours ? `<span class="tag hours">🕒 ${esc(tr(hours))}</span>` : "",
      map ? `<a class="tag map" href="${esc(map)}" target="_blank" rel="noopener">${t("tagMap")}</a>` : "",
      place ? `<a class="tag nav" href="${kakaoTo(place)}" target="_blank" rel="noopener">${t("tagNav")}</a>` : ""
    ].join("");
    return `<li class="item${move ? " move" : ""}" data-day="${day.iso}" data-time="${esc(time)}">
      <div class="card">
        <div class="time">${esc(time)}</div>
        <div class="title">${esc(tr(title))}</div>
        ${tags && !move ? `<div class="meta">${tags}</div>` : ""}
        ${note ? `<div class="note">${esc(tr(note))}</div>` : ""}
      </div>
    </li>`;
  }).join("");

  daysEl.insertAdjacentHTML("beforeend", `
    <section class="day" id="${day.id}">
      <div class="day-head">
        <h2><em>${day.label}</em>${dateL(day.date)}</h2>
        <span class="sub">${t("per", won(sub))}</span>
      </div>
      ${routeMap(day)}
      <ol class="timeline">${lis}</ol>
    </section>`);
});

document.getElementById("total").innerHTML = `
  <h3>${t("totalTitle")}</h3>
  ${subtotals.map(([d, s]) => `<div class="row"><span>${d.label} ${dateL(d.date)}</span><span>${won(s)}</span></div>`).join("")}
  <div class="row sum"><span>${t("sum")}</span><span>${won(grand)}</span></div>`;
document.getElementById("hero-cost").textContent = won(grand);
}

// 여행 당일에는 지금 진행 중인 일정을 강조 (한국 시간 기준)
function highlightNow() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false
  }).formatToParts(new Date()).reduce((o, p) => (o[p.type] = p.value, o), {});
  const today = `${parts.year}-${parts.month}-${parts.day}`;
  const nowMin = (Number(parts.hour) % 24) * 60 + Number(parts.minute);

  document.querySelectorAll(".item").forEach(li => {
    li.classList.remove("now");
    li.querySelector(".now-badge")?.remove();
  });
  const items = [...document.querySelectorAll(`.item[data-day="${today}"]`)];
  let current = null;
  items.forEach(li => {
    const [a, b] = li.dataset.time.split("-");
    const start = toMin(a), end = b ? toMin(b) : start + 30;
    if (nowMin >= start && nowMin < end) current = li;
  });
  if (current) {
    current.classList.add("now");
    current.querySelector(".title").insertAdjacentHTML("beforeend", `<span class="now-badge">${t("now")}</span>`);
  }
  return current;
}
const MAPS = [];
let SHEET_STATE = null; // null: 연동 안 함, { ok, at }
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  const sync = document.getElementById("sync");
  if (SHEET_STATE) {
    sync.textContent = SHEET_STATE.ok ? t("synced", SHEET_STATE.at) : t("syncFail");
    sync.classList.toggle("off", !SHEET_STATE.ok); sync.hidden = false;
  }
}
function paint() {
  MAPS.splice(0).forEach(m => { try { m.remove(); } catch (e) {} });
  applyStatic();
  render();
  DAYS.forEach(initMap);
  DAYS.forEach(d => {
    if (d.unknown && d.unknown.length) {
      const n = document.getElementById(`note-${d.id}`);
      n.textContent = t("unknown", d.unknown.map(tr).join(", ")); n.hidden = false;
    }
  });
  return highlightNow();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem("lang", LANG); } catch (e) {}
  try { const u = new URL(location.href); u.searchParams.set("lang", LANG); history.replaceState(null, "", u); } catch (e) {}
  const y = scrollY; paint(); scrollTo(0, y);
}));

(async () => {
  const fromSheet = await loadSheet();
  if (fromSheet) DAYS = fromSheet;
  if (SHEET_CSV_URL) {
    const hm = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
    SHEET_STATE = { ok: !!fromSheet, at: hm };
  }
  const cur = paint();
  if (cur && !location.hash) cur.scrollIntoView({ block: "center" });
  else if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  setInterval(highlightNow, 60000);
})();
</script>
